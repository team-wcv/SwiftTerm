name: Swift

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - 'LICENSE.md'
      - 'branch.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # The macOS job runs on pull requests only while the org variable
  # SWIFT_KIT_CI_ON_PULL_REQUEST is 'true', which needs a recorded cost exception
  # (team-wcv/repo-policy docs/ci-cost-policy.md rule 1). Otherwise it skips.
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Inline per the G3b exception (sample Xcode projects), so it does not call
# team-wcv/.github swift-kit-ci-platforms.yml. It uses the same toolchain rule:
# exact Xcode 27.0 on the xcode-27 image, failing if that bundle is missing.
jobs:
  build:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && vars.SWIFT_KIT_CI_ON_PULL_REQUEST == 'true')
      }}

    runs-on: xcode-27
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      env:
        XCODE_APP: /Applications/Xcode_27.0.app
        XCODE_VERSION: '27.0'
      run: |
        set -euo pipefail
        developer_dir="$XCODE_APP/Contents/Developer"
        if [ ! -d "$developer_dir" ]; then
          echo "::error::Xcode not found at $XCODE_APP on runner image '${ImageOS:-unknown}' ${ImageVersion:-}. Installed bundles:"
          ls -d /Applications/Xcode*.app || true
          exit 1
        fi
        reported="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -1)"
        case "$reported" in
          "Xcode $XCODE_VERSION" | "Xcode $XCODE_VERSION".*) ;;
          *)
            echo "::error::$XCODE_APP reports '$reported'; this workflow requires Xcode $XCODE_VERSION"
            exit 1
            ;;
        esac
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$developer_dir" xcodebuild -version
        DEVELOPER_DIR="$developer_dir" swift --version

#    - name: Checkout esctest for testing
#      uses: actions/checkout@v4
#      with:
#        repository: migueldeicaza/esctest
#        ref: python3
#        path: esctest

    - name: List all files, because this is driving me insane, this does not repro anywhere but github
      run: ls -lR

    - name: Xcode Mac Build
      run: xcodebuild -project TerminalApp/MacTerminal.xcodeproj -scheme MacTerminal

    - name: Xcode iOS Build
      run: |
        xcodebuild -project TerminalApp/iOSTerminal.xcodeproj -scheme iOSTerminal -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

    - name: Swift Package Build
      run: swift build -v

    # The package's own iOS Simulator slice, built against its iOS 13 floor.
    - name: Swift Package Build (iOS Simulator)
      run: |
        set -euo pipefail
        xcodebuild build \
          -scheme SwiftTerm \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -quiet

    - name: Run tests
      env:
        SWIFT_TEST_DISABLE_PARALLELIZATION: "1"
      run: swift test -v

    - name: Coverage
      env:
        SWIFT_TEST_DISABLE_PARALLELIZATION: "1"
      run: |
        swift test --enable-code-coverage
        BINDIR=$(swift build --show-bin-path)
        xcrun llvm-cov report "$BINDIR/SwiftTermPackageTests.xctest/Contents/MacOS/SwiftTermPackageTests" --instr-profile=.build/debug/codecov/default.profdata -use-color
